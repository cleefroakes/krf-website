<script>
// ─────────────────────────────────────────────
// LOGIN FORM TOGGLE
// ─────────────────────────────────────────────
function showRegForm() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
  // Force player role tab when registering
  const tabs = document.querySelectorAll('.role-tab');
  tabs.forEach(t => t.classList.remove('active'));
  const playerTab = document.querySelector('.role-tab[data-role="player"]');
  if (playerTab) { playerTab.classList.add('active'); selectRole('player', playerTab); }
}
function showLoginForm() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('registerForm').style.display = 'none';
}

// ─────────────────────────────────────────────
// ALL PAGE RENDERS — delegates from portal.js
// ─────────────────────────────────────────────
window.renderPortalPageById = function(id) {
  const renders = {
    overview,   live,        lineup,     events,
    report,     playerreg,   teamreg,    users,
    teams_admin,tournaments, gallery,    settings,
    profile,    mystats,     schedule,
    commlive,   precheck,    incidents,  countersign,
    boundary,   lineview,    linesign,   mydocs,
    news,
  };
  if (renders[id]) renders[id]();
  else document.getElementById('mainContent').innerHTML =
    `<div style="padding:2rem;color:var(--dim)">Page "${id}" coming soon.</div>`;
};

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function panel(title, tag, body) {
  return `<div class="panel">
    <div class="ph"><span class="pt">${title}</span><span class="pg">${tag}</span></div>
    <div class="pb">${body}</div>
  </div>`;
}

function signoffChainHTML() {
  const s = STATE.reportState;
  return `<div class="signoff-chain">
    <div class="sof-step done">✓ Events logged</div><div class="sof-arrow">→</div>
    <div class="sof-step ${s.refSubmitted?'done':'current'}">Referee submits${s.refSubmitted?' ✓':''}</div><div class="sof-arrow">→</div>
    <div class="sof-step ${s.lineSignedOff?'done':s.refSubmitted?'current':'pending'}">Linesman signs${s.lineSignedOff?' ✓':''}</div><div class="sof-arrow">→</div>
    <div class="sof-step ${s.commCountersigned?'locked':s.lineSignedOff?'current':'pending'}">${s.commCountersigned?'🔒 Locked':'Commissioner countersigns'}</div><div class="sof-arrow">→</div>
    <div class="sof-step ${s.commCountersigned?'done':'pending'}">Admin publishes${s.commCountersigned?' ✓':''}</div>
  </div>`;
}

function scoreMiniHTML() {
  const m = STATE.liveMatch;
  const home = m?.home_team?.name || 'Home Team';
  const away = m?.away_team?.name || 'Away Team';
  return `<div style="background:var(--bg3);border-radius:6px;padding:.75rem;text-align:center">
    <div style="font-size:.6rem;color:var(--dim);letter-spacing:.8px;margin-bottom:.4rem;text-transform:uppercase">${m?.tournament?.name||'KPL'} · ${m?.venue||'Nyayo Stadium'}</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:1rem">
      <span style="font-size:.82rem;font-weight:600">${home}</span>
      <span id="miniScore" style="font-family:var(--font-head);font-size:2rem;color:var(--gold);letter-spacing:3px">${STATE.liveH} — ${STATE.liveA}</span>
      <span style="font-size:.82rem;font-weight:600">${away}</span>
    </div>
    <div id="miniTimer" style="font-size:.68rem;color:var(--red);margin-top:.3rem;font-weight:500">Q${STATE.period} · In Progress</div>
  </div>`;
}

function schedMiniHTML() {
  const upcoming = (STATE.schedules||[]).filter(m=>m.status==='upcoming').slice(0,3);
  if (!upcoming.length) return '<div style="color:var(--dim);font-size:.78rem;padding:.25rem 0">No upcoming fixtures</div>';
  return upcoming.map(s=>{
    const d = s.match_date ? new Date(s.match_date).toLocaleDateString('en-KE',{weekday:'short',day:'numeric',month:'short'}) : 'TBC';
    return `<div style="display:flex;align-items:center;gap:.65rem;padding:.45rem 0;border-bottom:1px solid rgba(255,255,255,.03)">
      <div style="text-align:center;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:.28rem .5rem;min-width:38px;flex-shrink:0">
        <div style="font-family:var(--font-head);font-size:1.1rem;color:var(--gold);line-height:1">${new Date(s.match_date||Date.now()).getDate()}</div>
        <div style="font-size:.5rem;color:var(--muted);text-transform:uppercase">${d.split(' ')[0]}</div>
      </div>
      <div style="flex:1">
        <div style="font-size:.78rem;font-weight:500;color:var(--white)">${s.home_team?.name||'TBC'} vs ${s.away_team?.name||'TBC'}</div>
        <div style="font-size:.62rem;color:var(--dim);margin-top:1px">${d} · ${s.tournament?.name||''}</div>
      </div>
    </div>`;
  }).join('');
}

function docProgressHTML(docs, navTarget) {
  const done = docs.filter(d=>d.status==='done'||d.status==='approved').length;
  const pct  = docs.length ? Math.round((done/docs.length)*100) : 0;
  return `<div class="prog-wrap">
    <div class="prog-label"><span>${done}/${docs.length} docs</span><span style="color:var(--gold);font-weight:600">${pct}%</span></div>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
  </div>
  ${docs.slice(0,4).map(d=>`
    <div style="display:flex;align-items:center;gap:.4rem;padding:.28rem 0;font-size:.74rem;border-bottom:1px solid rgba(255,255,255,.025)">
      <span>${d.icon||'📄'}</span>
      <span style="flex:1;color:var(--soft)">${d.label||d.doc_type}</span>
      <span class="bdg bdg-${d.status==='approved'||d.status==='done'?'green':d.status==='flagged'?'red':'gray'}">${d.status}</span>
    </div>`).join('')}
  <button class="btn-s" style="width:100%;margin-top:.55rem;font-size:.7rem;padding:.32rem" onclick="nav('${navTarget||'mydocs'}')">View All →</button>`;
}

function docsGridHTML(docs) {
  return `<div class="doc-grid">${docs.map(d=>`
    <div class="doc-item ${d.status==='approved'||d.status==='done'?'done':d.status==='flagged'?'flagged':''}"
         onclick="triggerDocUpload('${d.id||d.doc_type}')">
      <div class="di-icon">${d.icon||'📄'}</div>
      <div class="di-info"><strong>${d.label||d.doc_type}</strong><small>${d.sub||d.description||''}</small></div>
      <span class="di-st ${d.status==='approved'||d.status==='done'?'done':d.status==='flagged'?'flagged':'pending'}">${d.status==='approved'||d.status==='done'?'✓':d.status==='flagged'?'⚠':'+'}</span>
    </div>`).join('')}</div>`;
}

function triggerDocUpload(docType) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.pdf,.jpg,.jpeg,.png,.webp';
  input.onchange = async (e) => {
    if (e.target.files[0]) await handleDocUpload(e.target, docType);
  };
  input.click();
}

function eventItemsHTML(events, max=20) {
  const iconMap = { goal:'⚽', yellow:'🟨', red_card:'🟥', foul:'🔴', sub:'🔄', injury:'🩹', boundary:'🚩', offside:'⛔' };
  return events.slice(0,max).map(e=>`
    <div class="ev-item">
      <span class="ev-min">${e.min||e.minute+"'"}</span>
      <div class="ev-ico ${e.type||e.event_type}">${e.icon||iconMap[e.event_type]||'◉'}</div>
      <span class="ev-desc">${e.desc||e.description||''}</span>
      <span class="ev-by">${e.by||e.logged_by_role||''}</span>
    </div>`).join('');
}

function getCurrentDocs() {
  const role = STATE.user?.role;
  const loaded = STATE.docs || [];
  const base = role === 'player' ? PLAYER_DOCS : OFFICIAL_DOCS;
  // Merge loaded statuses into static definitions
  return base.map(d => {
    const live = loaded.find(l => l.doc_type === d.id);
    return live ? { ...d, status: live.status } : d;
  });
}

function overview() {
  const role = STATE.user?.role;
  if (role === 'player')       return overviewPlayer();
  if (role === 'referee')      return overviewReferee();
  if (role === 'commissioner') return overviewCommissioner();
  if (role === 'linesman')     return overviewLinesman();
  if (role === 'official')     return overviewOfficial();
  overviewAdmin();
}

async function lineup() {
  const isAdmin = STATE.user?.role === 'admin';
  const isTM    = STATE.user?.role === 'team_manager';

  // Fetch all matches for selection
  const { data: matchList } = await STATE.sb
    .from('matches')
    .select('id, match_date, home_team:teams!home_team_id(id,name), away_team:teams!away_team_id(id,name), tournament:tournaments(name)')
    .in('status', ['upcoming','live'])
    .order('match_date', { ascending: true })
    .limit(10);

  // Fetch players for the TM's team or all players for admin
  const teamId = STATE.user?.team_id;
  let playerQuery = STATE.sb.from('users').select('id,name,jersey_number,position').eq('role','player').eq('is_active',true);
  if (isTM && teamId) playerQuery = playerQuery.eq('team_id', teamId);
  const { data: players } = await playerQuery.order('jersey_number');

  const POSITIONS = ['Centre Man','Winger Right','Winger Left','Front Right','Front Left'];

  document.getElementById('mainContent').innerHTML = `
    <div class="g2">
      <div>
        ${panel('SUBMIT LINEUP', isTM ? 'Your team' : 'Select match & team', `
          <div class="fg" style="margin-bottom:.75rem">
            <label>Match</label>
            <select id="lineupMatchId" onchange="loadExistingLineup()"
              style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:.55rem .75rem;color:var(--white);font-size:.82rem;outline:none">
              <option value="">— Select match —</option>
              ${(matchList||[]).map(m => {
                const d = m.match_date ? new Date(m.match_date).toLocaleDateString('en-KE',{day:'numeric',month:'short'}) : 'TBC';
                return `<option value="${m.id}">${m.home_team?.name||'?'} vs ${m.away_team?.name||'?'} · ${d}</option>`;
              }).join('')}
            </select>
          </div>
          ${!isTM ? `
          <div class="fg" style="margin-bottom:.75rem">
            <label>Team Side</label>
            <select id="lineupSide"
              style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:.55rem .75rem;color:var(--white);font-size:.82rem;outline:none">
              <option value="home">Home Team</option>
              <option value="away">Away Team</option>
            </select>
          </div>` : ''}

          <div style="margin:.75rem 0;font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted)">Starting Five</div>
          <div style="display:grid;gap:.5rem" id="positionSlots">
            ${POSITIONS.map(pos => `
              <div style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:.55rem .85rem;display:flex;align-items:center;gap:.65rem">
                <div style="font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;width:90px;flex-shrink:0">${pos}</div>
                <select data-pos="${pos}"
                  style="flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:.4rem .65rem;color:var(--white);font-size:.78rem;outline:none">
                  <option value="">— Select player —</option>
                  ${(players||[]).map(p=>`<option value="${p.id}">#${p.jersey_number||'?'} ${p.name}</option>`).join('')}
                </select>
              </div>`).join('')}
          </div>

          <div class="fg" style="margin-top:.75rem">
            <label>Notes for referee</label>
            <textarea id="lineupNotes" rows="2" placeholder="Any lineup notes, late changes..."
              style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:.55rem .75rem;color:var(--white);font-size:.82rem;outline:none;resize:vertical"></textarea>
          </div>

          <div style="display:flex;gap:.5rem;margin-top:.85rem">
            <button class="btn-p" style="flex:1" onclick="submitLineup()">SUBMIT LINEUP</button>
            <button class="btn-s" onclick="showToast('Draft saved locally')">Save Draft</button>
          </div>
          <div id="lineupStatus" style="margin-top:.5rem"></div>
        `)}
      </div>
      <div>
        ${panel('SUBMITTED LINEUPS', 'This fixture', `
          <div id="lineupPreview" style="color:var(--dim);font-size:.78rem;padding:.5rem 0">
            Select a match to see submitted lineups.
          </div>`)}
      </div>
    </div>`;
}

async function loadExistingLineup() {
  const matchId = document.getElementById('lineupMatchId')?.value;
  if (!matchId) return;
  const preview = document.getElementById('lineupPreview');
  if (preview) preview.innerHTML = '<div style="color:var(--dim);font-size:.78rem">Loading...</div>';

  const { data: lineups } = await STATE.sb
    .from('lineups')
    .select('*, player:users(name,jersey_number), submitted_by:users!lineups_submitted_by_fkey(name,role)')
    .eq('match_id', matchId);

  if (!lineups || !lineups.length) {
    if (preview) preview.innerHTML = '<div style="color:var(--dim);font-size:.78rem;padding:.5rem">No lineups submitted yet for this match.</div>';
    return;
  }

  const grouped = {};
  lineups.forEach(l => {
    const side = l.team_side || 'home';
    if (!grouped[side]) grouped[side] = [];
    grouped[side].push(l);
  });

  if (preview) preview.innerHTML = Object.entries(grouped).map(([side, entries]) => `
    <div style="margin-bottom:.85rem">
      <div style="font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:.45rem">${side} team lineup</div>
      <table class="dt">
        <thead><tr><th>#</th><th>Player</th><th>Position</th></tr></thead>
        <tbody>${entries.map(e=>`<tr>
          <td style="font-family:var(--font-head);color:var(--gold)">${e.player?.jersey_number||'?'}</td>
          <td style="font-weight:500">${e.player?.name||'—'}</td>
          <td><span class="bdg bdg-gray" style="font-size:.6rem">${e.position||'—'}</span></td>
        </tr>`).join('')}</tbody>
      </table>
      <div style="font-size:.62rem;color:var(--muted);margin-top:.3rem">
        Submitted by ${entries[0]?.submitted_by?.name||'—'} · ${entries[0]?.submitted_by?.role||''}
      </div>
    </div>`).join('');
}

async function submitLineup() {
  const matchId = document.getElementById('lineupMatchId')?.value;
  if (!matchId) { showToast('Select a match first'); return; }

  const isTM   = STATE.user?.role === 'team_manager';
  const side   = isTM ? 'home' : (document.getElementById('lineupSide')?.value || 'home');
  const notes  = document.getElementById('lineupNotes')?.value || '';
  const slots  = document.querySelectorAll('#positionSlots select[data-pos]');

  const entries = [];
  let missing = false;
  slots.forEach(sel => {
    if (!sel.value) { missing = true; return; }
    entries.push({ match_id: matchId, player_id: sel.value, position: sel.dataset.pos, team_side: side, notes, submitted_by: STATE.user.id });
  });

  if (missing) { showToast('Select a player for every position'); return; }

  showToast('Submitting lineup...');
  // Delete existing lineup for this match/side first
  await STATE.sb.from('lineups').delete().eq('match_id', matchId).eq('team_side', side).eq('submitted_by', STATE.user.id);
  const { error } = await STATE.sb.from('lineups').insert(entries);

  if (error) { showToast('Error: ' + error.message); return; }

  document.getElementById('lineupStatus').innerHTML =
    '<div style="padding:.5rem .75rem;background:var(--green-dim);border-radius:5px;font-size:.72rem;color:#4cd97b">✓ Lineup submitted successfully!</div>';
  showToast('Lineup submitted!');
  loadExistingLineup();
}

function logBoundaryCall(type, team) {
  const elapsed = Math.max(1, STATE.period*15 - Math.floor(STATE.matchTimer/60));
  const icon = type.includes('Offside')?'⛔':type.includes('Sub')?'🔄':'🚩';
  STATE.events.unshift({ min:elapsed+"'", type:'boundary', icon, desc:`${type}${team?' — '+team:''}`, by:'linesman' });
  const list = document.getElementById('lineCallsList');
  if (list) {
    const myEvents = STATE.events.filter(e=>(e.by||e.logged_by_role)==='linesman');
    list.innerHTML = eventItemsHTML(myEvents);
  }
  showToast(`Logged: ${type}${team?' ('+team+')':''}`);
}

function filterUsersTable(q) {
  const filtered = (window._allUsers||[]).filter(u =>
    (u.name||'').toLowerCase().includes(q.toLowerCase()) ||
    (u.role||'').toLowerCase().includes(q.toLowerCase()) ||
    (u.team?.name||'').toLowerCase().includes(q.toLowerCase())
  );
  const body = document.getElementById('usersBody');
  if (body) body.innerHTML = buildUserRows(filtered);
}

async function quickAssignRole(userId, role) {
  await STATE.sb.from('users').update({ role }).eq('id', userId);
  const u = (window._allUsers||[]).find(x => x.id === userId);
  if (u) u.role = role;
}

async function quickAssignTeam(userId, teamId) {
  await STATE.sb.from('users').update({ team_id: teamId || null }).eq('id', userId);
  const u = (window._allUsers||[]).find(x => x.id === userId);
  if (u) u.team_id = teamId;
}

function openUserEdit(userId) {
  const u = (window._allUsers||[]).find(x => x.id === userId);
  if (!u) return;
  document.getElementById('editUserId').value    = userId;
  document.getElementById('editUserName').value  = u.name || '';
  document.getElementById('editUserRole').value  = u.role || 'player';
  document.getElementById('editUserTeam').value  = u.team_id || '';
  document.getElementById('editUserDocs').value  = u.docs_status || 'incomplete';
  const wrap = document.getElementById('userEditWrap');
  wrap.style.display = 'flex';
}

function closeUserEdit() {
  document.getElementById('userEditWrap').style.display = 'none';
}

async function saveUserEdit() {
  const id       = document.getElementById('editUserId')?.value;
  const name     = document.getElementById('editUserName')?.value?.trim();
  const role     = document.getElementById('editUserRole')?.value;
  const team_id  = document.getElementById('editUserTeam')?.value || null;
  const docs_status = document.getElementById('editUserDocs')?.value;
  if (!id) return;

  showToast('Saving...');
  const { error } = await STATE.sb.from('users').update({ name, role, team_id, docs_status }).eq('id', id);
  if (error) { showToast('Error: ' + error.message); return; }

  const u = (window._allUsers||[]).find(x => x.id === id);
  if (u) Object.assign(u, { name, role, team_id, docs_status });
  showToast('User updated!');
  closeUserEdit();
  users();
}

async function approveUser(id) {
  await STATE.sb.from('users').update({ is_active: true }).eq('id', id);
  showToast('User approved!');
  users();
}

async function rejectUser(id) {
  if (!confirm('Reject and deactivate this user?')) return;
  await STATE.sb.from('users').update({ is_active: false, docs_status: 'flagged' }).eq('id', id);
  showToast('User rejected');
  users();
}

async function deactivateUser() {
  const id = document.getElementById('editUserId')?.value;
  if (!id || !confirm('Deactivate this user?')) return;
  await STATE.sb.from('users').update({ is_active: false }).eq('id', id);
  showToast('User deactivated');
  closeUserEdit();
  users();
}

function exportUsersCSV() {
  const rows = [['Name','Role','Team','Active','Docs']];
  (window._allUsers||[]).forEach(u => rows.push([u.name, u.role, u.team?.name||'', u.is_active?'Yes':'No', u.docs_status||'incomplete']));
  const csv = rows.map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv,' + encodeURIComponent(csv);
  a.download = 'krf-users.csv';
  a.click();
  showToast('CSV exported!');
}

}

function toggleHeroInputs() {

function renderSponsorsList() {
  const sponsors = STATE.sponsors || [];
  if (!sponsors.length) return '<div style="color:var(--dim);font-size:.78rem;padding:.5rem">No sponsors yet</div>';
  const tierColor = { title:'bdg-red', gold:'bdg-amber', silver:'bdg-gray', bronze:'bdg-gray' };
  return sponsors.map(s => `
    <div style="display:flex;align-items:center;gap:.6rem;padding:.45rem .6rem;background:var(--bg3);border-radius:5px;margin-bottom:.35rem">
      ${s.logo_url ? `<img src="${s.logo_url}" style="height:28px;width:auto;object-fit:contain;border-radius:3px"/>` : '<div style="width:28px;height:28px;background:var(--bg2);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.8rem">🏷️</div>'}
      <div style="flex:1">
        <div style="font-size:.78rem;font-weight:600;color:var(--white)">${s.name}</div>
        <span class="bdg ${tierColor[s.tier]||'bdg-gray'}" style="font-size:.55rem">${s.tier}</span>
      </div>
      <button class="btn-s" style="font-size:.6rem;padding:.18rem .45rem;color:var(--red)" onclick="removeSponsor('${s.id}')">Remove</button>
    </div>`).join('');
}

async function addSponsor() {
  const name    = document.getElementById('spName')?.value?.trim();
  const tier    = document.getElementById('spTier')?.value || 'bronze';
  const logo    = document.getElementById('spLogo')?.value?.trim() || null;
  const website = document.getElementById('spUrl')?.value?.trim() || null;
  if (!name) { showToast('Enter sponsor name'); return; }

  showToast('Saving...');
  const { data, error } = await STATE.sb.from('sponsors').insert({ name, tier, logo_url: logo, website_url: website, is_active: true }).select().single();
  if (error) { showToast('Error: ' + error.message); return; }
  STATE.sponsors = [...(STATE.sponsors||[]), data];
  document.getElementById('sponsorsList').innerHTML = renderSponsorsList();
  ['spName','spLogo','spUrl'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
  showToast('Sponsor added!');
}

async function removeSponsor(id) {
  if (!confirm('Remove this sponsor?')) return;
  await STATE.sb.from('sponsors').update({ is_active: false }).eq('id', id);
  STATE.sponsors = (STATE.sponsors||[]).filter(s => s.id !== id);
  document.getElementById('sponsorsList').innerHTML = renderSponsorsList();
  showToast('Sponsor removed');
}

async function handleSponsorLogoUpload(inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  showToast('Uploading logo...');
  const ext = file.name.split('.').pop();
  const path = `sponsors/${Date.now()}.${ext}`;
  const { error } = await STATE.sb.storage.from('media').upload(path, file, { upsert: true });
  if (error) { showToast('Upload failed: ' + error.message); return; }
  const { data: { publicUrl } } = STATE.sb.storage.from('media').getPublicUrl(path);
  const logoInput = document.getElementById('spLogo');
  if (logoInput) logoInput.value = publicUrl;
  showToast('Logo uploaded!');
}

async function handleHeroUpload(inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  showToast('Uploading...');
  const isVideo = file.type.startsWith('video/');
  const ext = file.name.split('.').pop();
  const path = `hero/${Date.now()}.${ext}`;
  const { error } = await STATE.sb.storage.from('media').upload(path, file, { upsert: true });
  if (error) { showToast('Upload failed: ' + error.message); return; }
  const { data: { publicUrl } } = STATE.sb.storage.from('media').getPublicUrl(path);
  if (isVideo) {
    const el = document.getElementById('heroUrl');
    if (el) el.value = publicUrl;
    document.getElementById('heroType').value = 'video';
  } else {
    const el = document.getElementById('heroImageUrl');
    if (el) el.value = publicUrl;
    document.getElementById('heroType').value = 'image';
  }
  toggleHeroInputs();
  showToast('Uploaded! Click Save Settings to apply.');
}

function renderFixtureTable() {
  const filterT = document.getElementById('schedFilterTournament')?.value || '';
  const filterS = document.getElementById('schedFilterStatus')?.value || '';
  const isAdmin = STATE.user?.role === 'admin';

  let matches = STATE.schedules || [];
  if (filterT) matches = matches.filter(m => m.tournament?.id === filterT || m.tournament_id === filterT);
  if (filterS) matches = matches.filter(m => m.status === filterS);

  const statusBadge = s => {
    const map = { live:'red', upcoming:'amber', completed:'green', postponed:'gray' };
    return `<span class="bdg bdg-${map[s]||'gray'}">${s==='live'?'● LIVE':s}</span>`;
  };

  const wrap = document.getElementById('fixtureTableWrap');
  if (!wrap) return;
  wrap.innerHTML = panel('FIXTURES', `${matches.length} matches`, matches.length ? `
    <table class="dt">
      <thead><tr>
        <th>Date</th><th>Home</th><th>Score</th><th>Away</th>
        <th>Venue</th><th>Tournament</th><th>Status</th>
        ${isAdmin ? '<th>Actions</th>' : ''}
      </tr></thead>
      <tbody>
        ${matches.map(m => {
          const d = m.match_date
            ? new Date(m.match_date).toLocaleDateString('en-KE',{day:'numeric',month:'short',year:'numeric'})
            : 'TBC';
          const t = m.match_date
            ? new Date(m.match_date).toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'})
            : '';
          const score = (m.status === 'completed' || m.status === 'live')
            ? `<span style="font-family:var(--font-head);font-size:1.05rem;color:var(--gold);letter-spacing:2px">${m.home_score??0} – ${m.away_score??0}</span>`
            : `<span style="color:var(--muted);font-size:.75rem">vs</span>`;
          return `<tr>
            <td style="font-size:.75rem;color:var(--dim);white-space:nowrap">${d}<br/><span style="font-size:.65rem;color:var(--muted)">${t}</span></td>
            <td style="font-weight:600;font-size:.82rem">${m.home_team?.name||'TBC'}</td>
            <td style="text-align:center">${score}</td>
            <td style="font-weight:600;font-size:.82rem">${m.away_team?.name||'TBC'}</td>
            <td style="font-size:.72rem;color:var(--dim)">${m.venue||'—'}</td>
            <td style="font-size:.72rem;color:var(--dim)">${m.tournament?.name||'—'}</td>
            <td>${statusBadge(m.status||'upcoming')}</td>
            ${isAdmin ? `<td style="display:flex;gap:.3rem">
              <button class="btn-s" style="font-size:.6rem;padding:.18rem .45rem" onclick="editFixture('${m.id}')">Edit</button>
              <button class="btn-s" style="font-size:.6rem;padding:.18rem .45rem;color:var(--red)" onclick="confirmDeleteFixture('${m.id}')">Delete</button>
            </td>` : ''}
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  ` : `<div style="padding:2rem;text-align:center;color:var(--dim);font-size:.82rem">No fixtures match your filters.</div>`);
}

function openFixtureForm(matchId) {
  document.getElementById('fixtureFormWrap').style.display = 'block';
  document.getElementById('fixtureEditId').value = '';
  document.getElementById('fixtureFormTitle').textContent = 'NEW FIXTURE';
  document.getElementById('fxDeleteBtn').style.display = 'none';
  // Reset fields
  ['fxHome','fxAway','fxTournament'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
  ['fxVenue','fxDate'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
  document.getElementById('fxStatus').value = 'upcoming';
  document.getElementById('fxHomeScore').value = '0';
  document.getElementById('fxAwayScore').value = '0';
  document.getElementById('fxScoreWrap').style.display = 'none';
  document.getElementById('fxScoreWrap2').style.display = 'none';
  document.getElementById('fixtureFormWrap').scrollIntoView({ behavior: 'smooth' });
}

function editFixture(matchId) {
  const m = STATE.schedules.find(x => x.id === matchId);
  if (!m) return;
  openFixtureForm();
  document.getElementById('fixtureEditId').value = matchId;
  document.getElementById('fixtureFormTitle').textContent = 'EDIT FIXTURE';
  document.getElementById('fxDeleteBtn').style.display = '';
  document.getElementById('fxHome').value       = m.home_team_id || '';
  document.getElementById('fxAway').value       = m.away_team_id || '';
  document.getElementById('fxVenue').value      = m.venue || '';
  document.getElementById('fxTournament').value = m.tournament_id || '';
  document.getElementById('fxStatus').value     = m.status || 'upcoming';
  document.getElementById('fxHomeScore').value  = m.home_score ?? 0;
  document.getElementById('fxAwayScore').value  = m.away_score ?? 0;
  if (m.match_date) {
    document.getElementById('fxDate').value = new Date(m.match_date).toISOString().slice(0,16);
  }
  const show = m.status === 'completed' || m.status === 'live';
  document.getElementById('fxScoreWrap').style.display  = show ? '' : 'none';
  document.getElementById('fxScoreWrap2').style.display = show ? '' : 'none';
  document.getElementById('fixtureFormWrap').scrollIntoView({ behavior: 'smooth' });
}

async function saveFixture() {
  const editId      = document.getElementById('fixtureEditId')?.value;
  const home_team_id   = document.getElementById('fxHome')?.value;
  const away_team_id   = document.getElementById('fxAway')?.value;
  const match_date     = document.getElementById('fxDate')?.value;
  const venue          = document.getElementById('fxVenue')?.value;
  const tournament_id  = document.getElementById('fxTournament')?.value || null;
  const status         = document.getElementById('fxStatus')?.value || 'upcoming';
  const home_score     = parseInt(document.getElementById('fxHomeScore')?.value) || 0;
  const away_score     = parseInt(document.getElementById('fxAwayScore')?.value) || 0;

  if (!home_team_id || !away_team_id) { showToast('Select both teams'); return; }
  if (home_team_id === away_team_id)  { showToast('Home and away teams must differ'); return; }
  if (!match_date) { showToast('Set a match date'); return; }

  const payload = {
    home_team_id, away_team_id,
    match_date: new Date(match_date).toISOString(),
    venue, tournament_id, status,
    home_score, away_score,
  };

  showToast('Saving...');
  let error;
  if (editId) {
    ({ error } = await STATE.sb.from('matches').update(payload).eq('id', editId));
  } else {
    ({ error } = await STATE.sb.from('matches').insert(payload));
  }

  if (error) { showToast('Error: ' + error.message); return; }
  showToast(editId ? 'Fixture updated!' : 'Fixture created!');
  closeFixtureForm();
  schedule(); // refresh
}

function closeFixtureForm() {
  document.getElementById('fixtureFormWrap').style.display = 'none';
}

async function confirmDeleteFixture() {
  const id = document.getElementById('fixtureEditId')?.value;
  if (!id) return;
  if (!confirm('Delete this fixture? This cannot be undone.')) return;
  deleteFixture(id);
}

async function deleteFixture(id) {
  const matchId = id || document.getElementById('fixtureEditId')?.value;
  if (!matchId) return;
  const { error } = await STATE.sb.from('matches').delete().eq('id', matchId);
  if (error) { showToast('Error: ' + error.message); return; }
  showToast('Fixture deleted');
  closeFixtureForm();
  schedule();
}

async function handleNewsMediaUpload(inputEl, type) {
  const file = inputEl.files[0];
  if (!file) return;
  showToast('Uploading...');
  const ext  = file.name.split('.').pop();
  const path = `news/${type}s/${Date.now()}.${ext}`;
  const { error } = await STATE.sb.storage.from('media').upload(path, file, { upsert: true });
  if (error) { showToast('Upload failed: ' + error.message); return; }
  const { data: { publicUrl } } = STATE.sb.storage.from('media').getPublicUrl(path);

  if (type === 'cover') {
    document.getElementById('news-cover').value = publicUrl;
    document.getElementById('newsCoverPreview').innerHTML =
      `<img src="${publicUrl}" style="height:60px;border-radius:4px;border:1px solid var(--border);object-fit:cover"/>`;
  } else {
    document.getElementById('news-video').value = publicUrl;
    document.getElementById('newsVideoPreview').textContent = '✓ Video uploaded: ' + file.name;
  }
  showToast(type === 'cover' ? 'Cover uploaded!' : 'Video uploaded!');
}

async function handleNewsGalleryUpload(inputEl) {
  const files = Array.from(inputEl.files).slice(0, 6);
  if (!files.length) return;
  showToast(`Uploading ${files.length} photo(s)...`);
  const urls = [];
  for (const file of files) {
    const ext  = file.name.split('.').pop();
    const path = `news/gallery/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const { error } = await STATE.sb.storage.from('media').upload(path, file, { upsert: true });
    if (error) continue;
    const { data: { publicUrl } } = STATE.sb.storage.from('media').getPublicUrl(path);
    urls.push(publicUrl);
  }
  document.getElementById('news-gallery').value = JSON.stringify(urls);
  document.getElementById('newsGalleryPreview').innerHTML = urls.map(u =>
    `<img src="${u}" style="height:52px;width:52px;object-fit:cover;border-radius:4px;border:1px solid var(--border)"/>`
  ).join('');
  showToast(`${urls.length} photo(s) ready!`);
}
async function users() {
  const { data: allUsers } = await STATE.sb
    .from('users')
    .select('*, team:teams(name)')
    .order('created_at', { ascending: false });
  window._allUsers = allUsers || [];
  document.getElementById('mainContent').innerHTML = `
    <div style="display:flex;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap;align-items:center">
      <button class="btn-p" style="font-size:.75rem;padding:.45rem 1rem" onclick="showToast('Add user form coming soon')">+ ADD USER</button>
      <button class="btn-s" onclick="exportUsersCSV()">Export CSV</button>
      <input placeholder="Search by name, role or team..." 
        style="background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:.4rem .75rem;color:var(--white);font-size:.78rem;outline:none;flex:1;min-width:180px" 
        oninput="filterUsersTable(this.value)"/>
    </div>
    ${panel('ALL REGISTERED USERS', (allUsers||[]).length + ' total', `
      <table class="dt" id="usersTable">
        <thead><tr><th>Name</th><th>Role</th><th>Team</th><th>Status</th><th>Docs</th><th>Action</th></tr></thead>
        <tbody id="usersBody">${buildUserRows(allUsers||[])}</tbody>
      </table>`)}`;
}

function buildUserRows(users) {
  return users.map(u => `<tr>
    <td style="font-weight:500">${u.name||'—'}</td>
    <td><span class="bdg bdg-${u.role==='admin'?'red':u.role==='commissioner'?'teal':u.role==='referee'?'blue':u.role==='linesman'?'amber':u.role==='official'?'purple':'green'}">${u.role||'player'}</span></td>
    <td style="font-size:.75rem;color:var(--dim)">${u.team?.name||'Unassigned'}</td>
    <td><span class="bdg bdg-${u.is_active?'green':'amber'}">${u.is_active?'Active':'Pending'}</span></td>
    <td><span class="bdg bdg-${u.docs_status==='approved'?'green':u.docs_status==='flagged'?'red':'amber'}">${u.docs_status||'incomplete'}</span></td>
    <td style="display:flex;gap:.3rem">
      <button class="btn-s" style="font-size:.6rem;padding:.18rem .45rem;color:var(--green)" onclick="approveUser('${u.id}')">✓ Approve</button>
      <button class="btn-s" style="font-size:.6rem;padding:.18rem .45rem;color:var(--red)" onclick="rejectUser('${u.id}')">✗ Flag</button>
    </td>
  </tr>`).join('');
}

function filterUsersTable(q) {
  const filtered = (window._allUsers||[]).filter(u =>
    (u.name||'').toLowerCase().includes(q.toLowerCase()) ||
    (u.role||'').toLowerCase().includes(q.toLowerCase()) ||
    (u.team?.name||'').toLowerCase().includes(q.toLowerCase())
  );
  const body = document.getElementById('usersBody');
  if (body) body.innerHTML = buildUserRows(filtered);
}

async function approveUser(id) {
  await STATE.sb.from('users').update({ docs_status: 'approved', is_active: true }).eq('id', id);
  showToast('User approved!');
  users();
}

async function rejectUser(id) {
  await STATE.sb.from('users').update({ docs_status: 'flagged', is_active: false }).eq('id', id);
  showToast('User flagged');
  users();
}

function exportUsersCSV() {
  const rows = [['Name','Role','Team','Active','Docs']];
  (window._allUsers||[]).forEach(u => rows.push([u.name, u.role, u.team?.name||'', u.is_active?'Yes':'No', u.docs_status||'incomplete']));
  const csv = rows.map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv,' + encodeURIComponent(csv);
  a.download = 'krf-users.csv';
  a.click();
  showToast('CSV exported!');
}
